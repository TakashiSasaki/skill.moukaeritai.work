name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run validation
        run: python tools/validate_all.py

      - name: Validate bundle definitions
        run: python tools/bundle/validate_bundle_definitions.py bundles/

      - name: Build bundles
        run: python tools/bundle/build_bundles.py --all --out .bundle-out

      - name: Verify bundle generation
        run: |
          for file in SKILL.md README.md references/bundle-lock.json references/specs/json-schema/document-record.schema.json references/catalog.snapshot.jsonld scripts/validate_all.py; do
            if [ ! -f ".bundle-out/document-record-authoring/$file" ]; then
              echo "FAIL: Missing generated file $file"
              exit 1
            fi
          done
          echo "PASS: All generated bundle files present."
